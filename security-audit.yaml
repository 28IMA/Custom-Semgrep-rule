- id: custom.audit.crypto.insecure-random-security-context
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: $V = random.$F(...)
    - pattern: $V = random.$F()
  - metavariable-regex:
      metavariable: $F
      regex: ^(random|randint|randrange|choice|getrandbits|random_sample|uniform|sample|shuffle)$
  - metavariable-regex:
      metavariable: $V
      regex: (?i).*(token|secret|password|passwd|pwd|nonce|salt|otp|apikey|api_key|session|csrf|key).*
  message: A non-cryptographic RNG (random module) is used to produce a security value (token/secret/nonce/salt/...). `random` is predictable. Use the `secrets` module (secrets.token_hex/token_urlsafe) or os.urandom for security-sensitive values.
  metadata:
    cwe:
    - 'CWE-330: Use of Insufficiently Random Values'
    owasp:
    - A02:2021 - Cryptographic Failures
    - A03:2025 - Cryptographic Failures
    technology:
    - python
    category: security
    subcategory:
    - audit
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
    references:
    - https://docs.python.org/3/library/secrets.html
    source-rule: overlay (baseline insecure-uuid-version is narrower)
    tuning-reason: Name-driven heuristic keeps precision high — only flags `random.*` results assigned to security-named variables, not all RNG usage.
    benchmark-evidence: Baseline has insecure-uuid-version but no name-aware weak-RNG-for-secrets heuristic.
    framework: []
    false-positive-risk: MEDIUM (review-only; name heuristic can over/under match).
    false-negative-risk: MEDIUM (misses security values held in non-obvious variable names).
    recommended-action: Review; switch to the secrets module for security values.
