- id: custom.secrets.generic.hardcoded-credential-assignment
  languages:
  - generic
  severity: ERROR
  paths:
    exclude:
    - '*test*'
    - '*Test*'
    - '*spec*'
    - '*Spec*'
    - '*fixture*'
    - '*example*'
    - '*sample*'
    - '*mock*'
    - '*.md'
    - '**/tests/**'
    - '**/test/**'
    - '**/testdata/**'
    - '**/__tests__/**'
    - '**/examples/**'
  patterns:
  - pattern-regex: (?i)(password|passwd|pwd|secret|api[_-]?key|apikey|access[_-]?token|auth[_-]?token|client[_-]?secret)\s*[:=]\s*["'][^"'\s]{8,}["']
  - pattern-not-regex: (?i)["'](changeme|change_me|change-me|placeholder|example|examplekey|your[_-]?|my[_-]?secret|insert[_-]?|todo|dummy|sample|redacted|secret|password|null|none|n/?a|test|xxx+|\*{3,}|\.{3,}|0+|1234|abcd)
  - pattern-not-regex: '["''](\$\{?[A-Za-z_].*|\{\{.*|%[A-Za-z_].*%|<[^>]+>)'
  - pattern-not-regex: (?i)(os\.environ|os\.getenv|getenv|process\.env|System\.getenv|Environment\.GetEnvironmentVariable|config\.|settings\.)
  message: A credential-looking identifier is assigned a hardcoded literal value. Hardcoded secrets leak through version control and build artifacts. Load secrets from environment variables or a secrets manager (Vault, AWS Secrets Manager, etc.). (Common placeholders and test fixtures are suppressed by this rule.)
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A02:2025 - Cryptographic Failures
    technology:
    - secrets
    category: security
    subcategory:
    - audit
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/798.html
    source-rule: 'overlay (gap: baseline has no generic credential-assignment rule with placeholder suppression)'
    tuning-reason: Baseline secrets rules target specific vendor token formats and have no sanitizers; this fills the generic-assignment gap while suppressing the placeholder/fixture noise that makes naive secret rules unusable.
    benchmark-evidence: 'Baseline secrets.yaml: 0 of 52 rules use pattern-sanitizers / placeholder suppression.'
    framework: []
    false-positive-risk: MEDIUM (generic; mitigated by placeholder + fixture-path suppression).
    false-negative-risk: MEDIUM (skips values < 8 chars and anything looking like a placeholder).
    recommended-action: Fail CI on confirmed secrets; rotate any committed credential.
- id: custom.secrets.private-key.pem-block
  languages:
  - generic
  severity: ERROR
  paths:
    exclude:
    - '*test*'
    - '*example*'
    - '*sample*'
    - '*fixture*'
    - '*.md'
    - '**/tests/**'
    - '**/testdata/**'
    - '**/examples/**'
  patterns:
